# =============================================================================
# Dependabot Configuration
# =============================================================================
# Watches:
#   1. GitHub Actions versions (workflows pinned to @main pull module updates)
#   2. Image references inside docker-compose*.yml files
#   3. Base image references inside app/shlink/Dockerfile and
#      app/shlink-web/Dockerfile (shlinkio/shlink, shlinkio/shlink-web-client)
#
# Image-tag updates that bump from a floating tag to a new floating tag
# (e.g. shlinkio/shlink:4 → shlinkio/shlink:5) surface here as PRs. Pure digest
# drift on existing tags is handled by check-base-images.yml (daily cron).
# =============================================================================

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Docker Compose images (Dependabot >= 2024-09 supports docker-compose ecosystem)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "chore(deps)"

  # shlink server base image (shlinkio/shlink in app/shlink/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/app/shlink"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "chore(docker)"

  # shlink web client base image (shlinkio/shlink-web-client in app/shlink-web/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/app/shlink-web"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "chore(docker)"
