# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs
# =============================================================================
# Every Dependabot PR starts this workflow (no paths filter), so each one gets
# a decision and an annotation instead of silently staying open. A PR is
# merged only after docker-release.yml has run on its head commit and passed;
# GitHub Actions updates and other .github/ changes always stay open for a
# manual merge.
#
# What docker-release.yml tests on a PR:
#   - app/shlink/Dockerfile, app/shlink-web/Dockerfile (docker): both images
#     are built, so a base image update there is tested.
#   - docker-compose*.yml (docker-compose): only validated (docker compose
#     config, image references exist) - no stack is started, so an image tag
#     update there is not tested. Dependabot opens no such PRs today: every
#     image reference is ${VAR:-default}, which it skips.
#
# Release: a merge made with the GITHUB_TOKEN starts no push workflow, so
# after the merge this workflow dispatches docker-release.yml on main and
# waits for it (release-workflow). That run builds both images from the
# merged commit again and only then:
# 1. Creates a semantic release (fix(docker) -> PATCH)
# 2. Builds and pushes the new urlshortener-server and -web images
# A release run that does not succeed turns this job red.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the images.
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it: it rebuilds the merged commit before it releases it,
      # and a failed release run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
