# =============================================================================
# Docker Maintenance — Auto-merge Dependabot PRs (Shlink Dockerfiles)
# =============================================================================
# When Dependabot opens a PR bumping a base image inside any of our
# Dockerfiles (app/shlink/Dockerfile or app/shlink-web/Dockerfile), this
# workflow auto-approves and merges it (after validation passes), which
# then triggers docker-release.yml to build and push the updated image.
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/shlink/Dockerfile'
      - 'app/shlink-web/Dockerfile'

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
    secrets: inherit
