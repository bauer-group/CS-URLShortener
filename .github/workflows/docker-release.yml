name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docker-compose*.yml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.coolify.yml", "docker-compose.traefik.yml", "docker-compose.development.yml"]'
      env-file: '.env.example'
      validate-services: '["shlink-server", "shlink-web", "shlink-db"]'

  # ============================================
  # Release Job (push to main or dispatch)
  # ============================================
  # Needs the compose validation and both image builds of this run (the
  # -validate jobs below run on every event): a failed build skips the
  # release and every image push.

  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, docker-build-server-validate, docker-build-web-validate]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.docker-build-server-validate.result == 'success' &&
      needs.docker-build-web-validate.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      # Release the commit this run validated and built - the image jobs
      # below build it too. Unpinned, the release would take the tip of
      # main: a push that landed meanwhile would be tagged untested and be
      # missing from the images. Pinned, nothing is released once main has
      # moved on, and the run for the newer main releases both.
      ref: ${{ github.sha }}
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ============================================
  # Docker Build & Push (urlshortener-server)
  # ============================================

  docker-build-server-release:
    name: 🐳 Build & Push urlshortener-server
    needs: release
    # Only a run that created a release publishes - never a PR, a branch
    # dispatch or a run that released nothing.
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-URLShortener/urlshortener-server'
      docker-image-name: 'bauergroup/cs-urlshortener-server'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './app/shlink/Dockerfile'
      docker-context: './app/shlink'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  # Builds the image from this commit on every event - the PR CI that
  # docker-maintenance.yml waits for, and on a push or dispatch the gate
  # of the release. Never pushed.
  docker-build-server-validate:
    name: 🔨 Validate urlshortener-server Build
    needs: [validate-compose]
    if: needs.validate-compose.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-URLShortener/urlshortener-server'

      auto-tags: true
      dockerfile-path: './app/shlink/Dockerfile'
      docker-context: './app/shlink'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Docker Build & Push (urlshortener-web)
  # ============================================

  docker-build-web-release:
    name: 🐳 Build & Push urlshortener-web
    needs: release
    # Only a run that created a release publishes.
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-URLShortener/urlshortener-web'
      docker-image-name: 'bauergroup/cs-urlshortener-web'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './app/shlink-web/Dockerfile'
      docker-context: './app/shlink-web'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: true
    secrets: inherit

  # Every event, never pushed - the gate the release job needs.
  docker-build-web-validate:
    name: 🔨 Validate urlshortener-web Build
    needs: [validate-compose]
    if: needs.validate-compose.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/CS-URLShortener/urlshortener-web'

      auto-tags: true
      dockerfile-path: './app/shlink-web/Dockerfile'
      docker-context: './app/shlink-web'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit
